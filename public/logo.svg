<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="detail door — clean. delivered.">
  <title>detail door — clean. delivered.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&amp;display=swap');
  </style>

  <!--
    Door motif on first "o" in "door":
    The "o" ring is INTACT. Two white shapes float inside its black interior:
      SEAM  x=597 y=96  w=3  h=28  (thin vertical strip, right inner wall)
      KNOB  x=588 y=106 w=5  h=5   (small square, left of seam)
    Adjust OX (first "o" center x=582) if misaligned after visual check.
  -->

  <!-- Wordmark: o ring intact, no mask -->
  <text
    x="450" y="135"
    text-anchor="middle"
    font-family="'Comfortaa', 'Nunito', 'Varela Round', sans-serif"
    font-weight="400"
    font-size="96"
    letter-spacing="1"
    fill="#FFFFFF"
  >detail door</text>

  <!-- Door seam: thin white vertical strip on right inner wall of first "o" -->
  <rect x="597" y="96" width="3" height="28" fill="#FFFFFF"/>

  <!-- Door knob: small white square to the left of the seam -->
  <rect x="588" y="106" width="5" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Tagline -->
  <text
    x="450" y="181"
    text-anchor="middle"
    font-family="'Comfortaa', 'Nunito', 'Varela Round', sans-serif"
    font-weight="300"
    font-size="19"
    letter-spacing="7"
    fill="#FFFFFF"
    opacity="0.88"
  >clean. delivered.</text>

</svg>
