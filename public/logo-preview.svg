    fill="#FFFFFF"
    mask="url(#door-seam-preview)"
  >detail door</text>

  <circle cx="587" cy="103" r="4" fill="#FFFFFF"/>

  <text
    x="450" y="181"
    text-anchor="middle"
    font-family="'Comfortaa', 'Nunito', 'Varela Round', sans-serif"
    font-weight="300"
    font-size="19"
